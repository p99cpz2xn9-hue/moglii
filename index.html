<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mogli ❤️</title>

<style>

body{
margin:0;
background:#000;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
text-align:center;
overflow-x:hidden;
}

section{
padding:80px 20px;
max-width:900px;
margin:auto;
}

h1{
font-size:50px;
}

.frase{
font-size:22px;
opacity:.9;
margin-top:15px;
}

.counter{
font-size:28px;
margin-top:30px;
}

.slideshow{
max-width:600px;
margin:auto;
}

.slideshow img{
width:100%;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.6);
}

video{
width:100%;
max-width:600px;
border-radius:20px;
margin-top:40px;
}

.letter{
font-size:20px;
line-height:1.8;
max-width:700px;
margin:auto;
margin-top:40px;
min-height:200px;
}

#startScreen{
position:fixed;
background:#000;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
flex-direction:column;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:10px;
background:#ff2a6d;
color:white;
cursor:pointer;
}

.heart{
position:fixed;
top:-10px;
color:#ff2a6d;
animation:fall linear forwards;
}

@keyframes fall{
0%{transform:translateY(0);}
100%{transform:translateY(110vh);}
}

</style>

</head>

<body>

<div id="startScreen">

<h1>Eu fiz algo pra você ❤️</h1>

<button onclick="start()">Abrir</button>

</div>


<section>

<h1>Mogli ❤️</h1>

<p class="frase">

Quando se há amor, sempre haverá chance.

</p>

</section>


<section>

<h2>Desde 9 de julho de 2023 — 11:25</h2>

<div class="counter" id="contador"></div>

</section>


<section>

<h2>Nossos momentos</h2>

<div class="slideshow">

<img id="slide" src="foto1.jpg">

</div>

<video id="video" muted autoplay loop>

<source src="video1.mp4">

</video>

</section>


<section>

<h2>Uma coisa que eu queria te dizer</h2>

<div class="letter" id="letter"></div>

</section>



<script>

function start(){

document.getElementById("startScreen").style.display="none"

document.getElementById("video").play()

}



const startDate = new Date("2023-07-09T11:25:00")

function updateCounter(){

let now = new Date()

let diff = now - startDate

let days = Math.floor(diff/(1000*60*60*24))
let hours = Math.floor((diff/(1000*60*60))%24)
let minutes = Math.floor((diff/(1000*60))%60)

document.getElementById("contador").innerText =
days+" dias • "+hours+" horas • "+minutes+" minutos"

}

setInterval(updateCounter,1000)

updateCounter()



const photos=["foto1.jpg","foto2.jpg"]

let index=0

setInterval(()=>{

index=(index+1)%photos.length

document.getElementById("slide").src=photos[index]

},3000)



const text=`

Mogli,

Esses dias eu parei pra pensar na nossa história…

e é impossível não lembrar daquele momento que mudou tudo pra mim.

9 de julho de 2023, às 11:25.

Foi ali que eu criei coragem pra te pedir em namoro.

Desde que você entrou na minha vida, muita coisa mudou dentro de mim.

Você trouxe risadas, momentos simples que viraram lembranças enormes.

A gente já passou por fases, altos e baixos…

mas tem uma coisa que nunca mudou:

o carinho enorme que eu sinto por você.

Você marcou minha história de verdade.

E mesmo com tudo que aconteceu…

você continua sendo muito importante pra mim.

E eu continuo acreditando na nossa história.

`

let i=0

function type(){

if(i<text.length){

document.getElementById("letter").innerHTML+=text.charAt(i)

i++

setTimeout(type,35)

}

}

type()



function heart(){

const heart=document.createElement("div")

heart.innerHTML="❤️"

heart.classList.add("heart")

heart.style.left=Math.random()*100+"vw"

heart.style.fontSize=(Math.random()*20+15)+"px"

heart.style.animationDuration=(Math.random()*4+3)+"s"

document.body.appendChild(heart)

setTimeout(()=>heart.remove(),7000)

}

setInterval(heart,250)

</script>

</body>

</html>
